version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: snathyar-backend:latest
    container_name: snathyar-backend
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "9301"
      UVICORN_WORKERS: "1"
      LOG_LEVEL: info
      RELOAD: "false"
      # Persist DB outside image (optional)
      # SHATHYAR_DB_URL: sqlite:////data/shathyar.db
    ports:
      - "9301:9301"
    volumes:
      - ./logs/backend:/logs
      # Uncomment to persist DB file
      # - ./shathyar.db:/data/shathyar.db
      # If you keep dictionary CSV at repo root, mount it read-only
      - ./shasiyaer.csv:/app/shasiyaer.csv:ro
    restart: unless-stopped

